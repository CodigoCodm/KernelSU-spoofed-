name: Build KernelSU Manager

on:
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x manager/gradlew
        working-directory: manager

      - name: Build APK with Gradle
        run: ./gradlew :app:assembleRelease
        working-directory: manager

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-manager-spoofed
          path: manager/app/build/outputs/apk/release/app-release-unsigned.apk
